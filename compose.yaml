services:
  api:
    image: brevgenerator2-api:test
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - TESTCONTAINERS=${TESTCONTAINERS:-}
      - DANGEROUS_DISABLE_AUTH=${DANGEROUS_DISABLE_AUTH:-}
    read_only: true
    tmpfs:
      - /tmp
    # Use Node's built-in fetch so the image needs no curl/wget (avoids extra package maintenance and CVEs)
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"

  web:
    image: brevgenerator2-web:test
    build:
      context: .
      dockerfile: apps/preview-web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PDF_API_URL=http://api:4000
    env_file:
      - path: apps/preview-web/.env.local
        required: false
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
