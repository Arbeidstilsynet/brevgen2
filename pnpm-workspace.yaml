packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: true
  sharp: false
  ssh2: false

autoInstallPeers: false

injectWorkspacePackages: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@next/*"
  - postcss@8.5.10
  - fast-xml-builder@1.1.7
  - fast-uri@3.1.2
  # Renovate security update: sanitize-html@2.17.4
  - sanitize-html@2.17.4
  - brace-expansion@5.0.6
  - ws@8.20.1
  - protobufjs@7.5.8

nodeLinker: hoisted

overrides:
  "@fastify/static": "9.1.3"
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  basic-ftp@<=5.2.2: ">=5.3.0"
  dompurify@<=3.3.3: ">=3.4.0"
  fast-jwt@<6.2.1: ">=6.2.1"
  fast-xml-parser@<5.7.0: '>=5.7.0'
  jimp@<1.6.1: ">=1.6.1"
  postcss@<8.5.10: ^8.5.10
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - jose@4.15.9
  - semver@6.3.1
