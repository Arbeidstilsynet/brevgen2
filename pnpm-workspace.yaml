packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  puppeteer: false
  sharp: false
  ssh2: false

autoDedupe: true

audit:
  level: high
  ignore:
    # https://github.com/vercel/next.js/issues/96064
    - GHSA-f88m-g3jw-g9cj
    # zod v3 used by pdf-visual-diff through jimp, doesnt take external input so should be safe
    - GHSA-mrhx-c7xc-m3w5

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExcludePrune: true

overrides:
  dompurify@<=3.4.11: ^3.4.12
  seroval@<=1.6.2: ^1.6.3
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExcludePrune: true

trustPolicyExclude:
  - chromium-bidi
  - jose@4.15.9
