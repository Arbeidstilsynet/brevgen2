packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: true
  sharp: false
  ssh2: false

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@grpc/grpc-js@1.14.4'
  - tmp@0.2.7
  - ws@8.21.0
  - protobufjs@7.6.3
  - form-data@2.5.6
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - '@opentelemetry/core@2.8.0'
  - undici@7.28.0
  - dompurify@3.4.11

overrides:
  "@fastify/static": "9.1.3"
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  basic-ftp@<=5.2.2: ">=5.3.0"
  dompurify@<=3.3.3: ">=3.4.0"
  fast-jwt@<6.2.1: ">=6.2.1"
  fast-xml-parser@<5.7.0: '>=5.7.0'
  jimp@<1.6.1: ">=1.6.1"
  postcss@<8.5.10: ^8.5.10
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - jose@4.15.9
  - semver@6.3.1
