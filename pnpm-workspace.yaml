packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: true
  sharp: false
  ssh2: false

audit:
  ignore:
    # https://github.com/vercel/next.js/issues/96064
    - GHSA-f88m-g3jw-g9cj

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - fast-uri@3.1.4 || 4.1.1
  - sharp@0.35.0
  - next@16.2.11
  - next-auth@4.24.15
  - find-my-way@9.6.1
  - '@fastify/static@10.1.1 || 10.1.2'
  - brace-expansion@2.1.3 || 5.0.8

overrides:
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  dompurify@<=3.3.3: ">=3.4.0"
  postcss@<8.5.10: ^8.5.10
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - jose@4.15.9
  - semver@6.3.1
