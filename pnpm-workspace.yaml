packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: true
  sharp: false
  ssh2: false

audit:
  level: high
  ignore:
    # https://github.com/vercel/next.js/issues/96064
    - GHSA-f88m-g3jw-g9cj

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - dompurify@3.4.12
  - postcss@8.5.23
  - undici@8.9.0
  - pdfjs-dist@6.2.108

overrides:
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  dompurify@<=3.4.11: ^3.4.12
  # https://github.com/advisories/GHSA-hq66-cqwq-w95j
  # also worth upgrading pdfjs while possible for other fixes
  # consuming package pdf-visual-diff may request 5.x for a while
  pdfjs-dist@>=5.6.83 <6.2.108: ^6.2.108
  postcss@<8.5.10: ^8.5.10
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - jose@4.15.9
  - semver@6.3.1
