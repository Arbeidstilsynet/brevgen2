packages:
  - apps/*
  - packages/*
  - nuget-client

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: false
  sharp: false
  ssh2: false

audit:
  level: high
  ignore:
    # https://github.com/vercel/next.js/issues/96064
    - GHSA-f88m-g3jw-g9cj

autoInstallPeers: false

minimumReleaseAge: 4320

overrides:
  dompurify@<=3.4.11: ^3.4.12
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - jose@4.15.9
  - semver@6.3.1
