apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: brevgen2-web
  namespace: plattform
  labels:
    team: plattform
spec:
  env:
    - name: PDF_API_URL
      value: "http://brevgen2-api"
    - name: PDF_AUTH_MODE
      value: bearer
  envFrom:
    - secret: azure-devops-pat-code-read # AZURE_DEVOPS_PAT
    - secret: brevgen2-azure-app-client-secret # AZURE_CLIENT_SECRET
    - secret: brevgen2-authjs-secret # AUTH_SECRET
    - secret: brevgen2-github-app-contents-read # GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY
  accessPolicy:
    outbound:
      rules:
        - application: brevgen2-api
      external:
        # Azure DevOps REST API
        - host: dev.azure.com
        - host: spsprodweu1.vssps.visualstudio.com
        - host: spsprodweu2.vssps.visualstudio.com
        - host: spsprodweu3.vssps.visualstudio.com
  port: 3000
  replicas:
    max: 2
    min: 2
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 150Mi
  readiness:
    path: /api/health
  liveness:
    path: /api/health
