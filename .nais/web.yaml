apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: "{{web.name}}"
  namespace: "{{team}}"
  labels:
    team: "{{team}}"
spec:
  env:
    - name: AZURE_APPLICATION_ID
      value: "{{azure_app_id}}"
    - name: NEXTAUTH_URL
      value: "{{web.ingress}}/api/auth"
    - name: PDF_API_URL
      value: "http://{{api.name}}"
    - name: PDF_AUTH_MODE
      value: bearer
    - name: GCP_BUCKET_NAME
      value: "{{bucket.name}}"
  envFrom:
    - secret: azure-devops-pat-code-read # AZURE_DEVOPS_PAT
    - secret: brevgen2-azure-app-client-secret # AZURE_CLIENT_SECRET
    - secret: brevgen2-authjs-secret # AUTH_SECRET
    - secret: brevgen2-github-app-contents-read # GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY
  ingresses:
    - "{{web.ingress}}"
  accessPolicy:
    outbound:
      rules:
        - application: "{{api.name}}"
      external:
        # Azure DevOps REST API
        - host: dev.azure.com
        - host: spsprodweu1.vssps.visualstudio.com
        - host: spsprodweu2.vssps.visualstudio.com
        - host: spsprodweu3.vssps.visualstudio.com
  port: 3000
  replicas:
    max: 2
    min: 2
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 150Mi
  readiness:
    path: /api/health
  liveness:
    path: /api/health
  gcp:
    buckets:
      - name: "{{bucket.name}}"
