apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: brevgen2-api
  namespace: plattform
  labels:
    team: plattform
spec:
  env:
    - name: PORT
      value: "4000"
    - name: AZURE_TENANT_ID
      value: da4bf886-a8a6-450d-a806-c347b8eb8d80
    - name: GENERATION_MAX_DURATION_MS
      value: "50000"
    - name: RENDERER_STALL_THRESHOLD_MS
      value: "20000"
    - name: RENDERER_RECOVERY_GRACE_MS
      value: "20000"
  accessPolicy:
    inbound:
      rules:
        - application: brevgen2-web
          namespace: plattform
  port: 4000
  replicas:
    max: 2
    min: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1024Mi
  startup:
    path: /health/startup
    failureThreshold: 15
    initialDelay: 5
    periodSeconds: 5
    timeout: 2
  readiness:
    path: /health/readiness
    failureThreshold: 3
    initialDelay: 0
    periodSeconds: 5
    timeout: 5
  liveness:
    path: /health/liveness
    failureThreshold: 3
    initialDelay: 0
    periodSeconds: 10
    timeout: 2
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
