name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nais: ${{ steps.nais.outputs.changes_detected }}
      brevgen2: ${{ steps.brevgen2.outputs.changes_detected }}
      nuget-client: ${{ steps.nuget-client.outputs.changes_detected}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Nais config changed?
        uses: Arbeidstilsynet/action-check-changes@6e51077b178b819e4194f40e32bd562df0954f3f # v1
        id: nais
        with:
          # correctly handle both push and pr events to get the right base ref
          base-ref: ${{ github.event_name == 'pull_request' && 'origin/main' ||
            github.event.before }}
          include: |
            .github/workflows/ci.yaml
            .nais

      - name: Brevgen2 changed?
        uses: Arbeidstilsynet/action-check-changes@6e51077b178b819e4194f40e32bd562df0954f3f # v1
        id: brevgen2
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'origin/main' ||
            github.event.before }}
          include: |
            .github/workflows/ci.yaml
            apps/
            packages/
            package.json
            pnpm*.yaml
            .ox*rc.json
          exclude: |
            **/*.md
            **/.gitignore
            packages/nuget-client/

      - name: Nuget-client changed?
        uses: Arbeidstilsynet/action-check-changes@6e51077b178b819e4194f40e32bd562df0954f3f # v1
        id: nuget-client
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'origin/main' ||
            github.event.before }}
          include: |
            .github/workflows/ci.yaml
            nuget-client/

  validate-nais:
    needs: changes
    if: needs.changes.outputs.nais == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .nais
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
      - run: nais --version
      - name: Validate environment manifests
        run: |
          for environment in dev prod; do
            for application in api web; do
              manifest="$RUNNER_TEMP/$application-$environment.yaml"
              yq eval-all '. as $item ireduce ({}; . *+ $item)' \
                "$application.yaml" "$application.$environment.yaml" > "$manifest"
              nais validate "$manifest"
            done
          done

  build:
    needs: changes
    if: needs.changes.outputs.brevgen2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

      - run: pnpm typecheck
        name: "Type check"

      - run: pnpm circular
        name: "Circular dependencies check"

      - run: pnpm test --filter=!nuget-client
        name: "Test"
        id: test

      # known issue: status check will be attached to the wrong workflow
      # https://github.com/orgs/community/discussions/24616
      # https://github.com/EnricoMi/publish-unit-test-result-action/issues/12
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        with:
          files: "**/junit.xml"
          check_name: "Brevgen2 Unit Test Results"

      - run: pnpm build --filter=!nuget-client
        name: "Build"

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      # workaround to install oxlint-tsgolint without overriding additional_dependencies in .pre-commit-config.yaml
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  testcontainer:
    needs: changes
    if: needs.changes.outputs.brevgen2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

      - run: "pnpm test:integration"
        id: test
        working-directory: "apps/api"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        with:
          files: "**/junit.xml"
          check_name: "Integration Test Results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        with:
          name: integration-test-snapshots
          path: apps/api/integration-tests/__snapshots__/

  # editor dockerfile is not covered elsewhere before deploy, unlike API that is built in testcontainer job
  editor-docker:
    needs: changes
    if: needs.changes.outputs.brevgen2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build editor image
        run: docker build --file apps/preview-web/Dockerfile .

  nuget-client:
    needs: changes
    if: needs.changes.outputs.nuget-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and Test .NET solution
        uses: Arbeidstilsynet/action-dotnet-build@a8f60cf0938ecf372e55bb14d7644b422c23c9f4 # v4
        with:
          working-directory: "."
          skip-csharpier: true
          skip-style-analyzers: true
